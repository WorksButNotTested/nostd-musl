name: Build and Publish to crates.io

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Configure Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Use the task name to build the cache key. We will have a separate
        # cache for each since they are both expensive to build and one builds
        # for many different architectures.
        shared-key: ubuntu
        # We want to include the commit hash to ensure the cache is replaced
        # on each new commit.
        key: ${{ github.sha }}
        cache-all-crates: true

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Run fmt
      run: cargo fmt -- --check

    - name: Build
      run: cargo build --verbose

    - name: Publish to crates.io
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        cargo publish --token $CARGO_REGISTRY_TOKEN

  macos:
    name: macOS
    runs-on: macOS-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Configure Cache
      uses: Swatinem/rust-cache@v2
      with:
        # Use the task name to build the cache key. We will have a separate
        # cache for each since they are both expensive to build and one builds
        # for many different architectures.
        shared-key: macOS
        # We want to include the commit hash to ensure the cache is replaced
        # on each new commit.
        key: ${{ github.sha }}
        cache-all-crates: true

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Run fmt
      run: cargo fmt -- --check

    - name: Build
      run: cargo build --verbose
